AWSTemplateFormatVersion: '2010-09-09'
Description: Simple CloudFormation Template to deploy an EC2 instance with a linked image webpage.

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c02fb55956c7d316
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          cat <<EOF > /var/www/html/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Hello There!</title>
          </head>
          <body>
              <h1>Hello There!</h1>
              <a href="https://ibb.co/0j0DW2tB">
                  <img src="https://i.ibb.co/4ZbmDtds/mike-profile-Linked-In-Profile-Picture.png" 
                       alt="mike-profile-Linked-In-Profile-Picture" 
                       border="0"
                       style="max-width: 100%; height: auto;">
              </a>
          </body>
          </html>
          EOF

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:
  InstancePublicIp:
    Description: Public IP address of the newly created EC2 instance
    Value: !GetAtt MyEC2Instance.PublicIp
    Export:
      Name: InstancePublicIp
